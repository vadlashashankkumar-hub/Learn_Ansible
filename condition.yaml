- name: even or odd
  hosts: local
  connection: local
  vars_prompt:
    - name: number
      prompt: "Enter a number"
      private: false

  tasks:
    - name: Is even
      debug:
        msg: "given number {{number}} is even"
      when: (number | int) % 2 == 0

    - name: Is odd
      debug:
        msg: "given number {{number}} is odd"
      when: (number | int) % 2 != 0