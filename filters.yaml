- name: Demo on filters
  hosts: local
  connection: local
  vars:
    name:
      - Vadla
      - Shashank
      - Kumar
    topics: "Linux, shell, ansible, Terraform"
    current_topic: Ansible

  tasks:
    - name: Print the name
      debug:
        msg: "Hi {{ person | default('Shanky') }}"

    - name: Convert string to list
      debug:
        msg: "Topics are: {{ topics | split(', ') }}"

    - name: Convert list to string
      debug:
        msg: "Name is {{ name | join(' ') }}"

    - name: Convert to lower case
      debug:
        msg: "current_topic in lower case: {{ current_topic | lower }}"